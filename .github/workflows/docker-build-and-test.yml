name: Docker Build and Run Test

on:
  push:
    branches:
      - 2.x  # Or any branch you want to trigger the workflow
      - dev
  pull_request:
    branches:
      - 2.x  # Or any branch you want to trigger the workflow
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Create a .env file
      run: |
        # docker-compose.yml.dist reads ${SEALOG_SERVER_SECRET} from a .env
        # file in the project root (Docker Compose's built-in env file support)
        cp .env.dist .env
        echo "SEALOG_SERVER_SECRET=$(openssl rand -base64 32)" >> .env

    - name: Modify docker-compose.yml
      run: |
        cp docker-compose.yml.dist docker-compose.yml

    - name: Modify Dockerfile
      run: |
        cp Dockerfile.dist Dockerfile

    - name: Build and Run Docker Compose
      run: |
        docker compose -f docker-compose.yml up -d --build
        docker compose ps

    - name: Wait for sealog-server to respond
      run: |
        for i in $(seq 1 60); do
          curl -fs -o /dev/null http://localhost:8000/sealog-server/documentation && exit 0
          sleep 2
        done
        echo "sealog-server did not respond within 120s" >&2
        exit 1

    - name: Show container logs
      if: failure()
      run: |
        docker compose ps -a
        docker compose logs

    - name: Tear down Docker Compose
      if: always()
      run: |
        docker compose down -v
